<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Chatbot AI Sederhana</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; padding:20px; }
    #chat { border:1px solid #ccc; height:400px; overflow-y:auto; padding:10px; background:#fff; border-radius:8px; margin-bottom:10px;}
    .user { color:#000; font-weight:bold; }
    .ai { color:#007bff; font-weight:bold; }
    input { width:75%; padding:10px; border-radius:5px; border:1px solid #ccc; }
    button { padding:10px 15px; border:none; background:#007bff; color:#fff; border-radius:5px; cursor:pointer; }
    button:hover { background:#0056b3; }
    p { margin:5px 0; }
  </style>
</head>
<body>
  <h2>Chatbot AI Sederhana</h2>
  <div id="chat"></div>
  <input id="msg" placeholder="Tulis pesan..." />
  <button onclick="sendMessage()">Kirim</button>

  <script>
    async function sendMessage() {
      const msg = document.getElementById("msg").value;
      if (!msg) return;
      document.getElementById("msg").value = "";
      const chatDiv = document.getElementById("chat");
      chatDiv.innerHTML += `<p><span class="user">Anda:</span> ${msg}</p>`;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        const data = await res.json();
        chatDiv.innerHTML += `<p><span class="ai">AI:</span> ${data.reply}</p>`;
        chatDiv.scrollTop = chatDiv.scrollHeight;
      } catch (err) {
        chatDiv.innerHTML += `<p><span class="ai">AI:</span> Error memanggil AI</p>`;
      }
    }
  </script>
</body>
</html>
